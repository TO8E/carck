# ============================================================
# WhiteCloud 白云天气 2.81 — Quantumult X 破解会员配置
# 把下面 [mitm] 和 [rewrite_local] 两段合并进你的 QX 配置文件，
# 把 WhiteCloud.js 放到 Quantumult X/Scripts/ 目录下。
# ============================================================

[mitm]
hostname = api.revenuecat.com, api-production.8-lives-cat.io, api.rc-backup.com, untech.cc, *.untech.cc, *.sunlitt.app

[rewrite_local]

# —— RevenueCat：伪装永久 entitlement（会员判定的主来源）——
^https:\/\/(api\.revenuecat\.com|api-production\.8-lives-cat\.io|api\.rc-backup\.com)\/v1\/subscribers\/ url script-request-header WhiteCloud.js
^https:\/\/(api\.revenuecat\.com|api-production\.8-lives-cat\.io|api\.rc-backup\.com)\/v1\/subscribers\/ url script-response-body WhiteCloud.js

# —— 自有服务端：recursive 改 membershipExpires / isMember 等字段 ——
^https:\/\/([a-z0-9-]+\.)?(untech\.cc|sunlitt\.app)\/api\/v2\/ url script-response-body WhiteCloud.js
